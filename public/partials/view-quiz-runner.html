<!-- ==================== VIEW 4: QUIZ RUNNER ==================== -->
<section x-show="currentView === 'quiz_runner' && activeQuestionSet" class="view" data-view="quiz_runner" style="gap: var(--space-xl)">
  <div class="quiz">
    <div>
      <button type="button" @click="returnFromQuizOrReview()" class="btn btn--ghost btn--sm">Keluar dari kuis</button>
    </div>

    <!-- TAHAP 1: PENDALAMAN MATERI (REMEDIAL REVIEW) -->
    <template x-if="activeQuestionSet?.setType === 'remedial' && remedialRunnerStep === 'study' && activeQuestionSet?.metadata?.diagnosticFeedback">
      <div class="stack-xl">
        <header class="stack-sm">
          <div class="split split--center">
            <span class="tag" style="background: var(--color-accent-soft); color: var(--color-ink); border-color: var(--color-accent)">
              Tahap 1: Pendalaman Materi Remedial
            </span>
            <button type="button" @click="remedialRunnerStep = 'quiz'" class="btn btn--sm">
              Langsung ke Kuis &rarr;
            </button>
          </div>
          <h1 class="page-title" style="font-size: var(--text-3xl)" data-view-title tabindex="-1" x-text="activeQuestionSet?.title"></h1>
          <p class="lede">
            Sebelum mengerjakan soal baru, pelajari bedah titik kecohan dan kaidah konsep BMP di bawah ini agar pemahaman Anda tuntas.
          </p>
        </header>

        <section class="callout callout--info" aria-labelledby="diag-overall-heading">
          <div class="stack-2xs">
            <h2 id="diag-overall-heading" class="sub-title">Diagnosis Utama</h2>
            <p class="prose math-prose" style="font-size: var(--text-md)" x-html="renderMath(activeQuestionSet.metadata.diagnosticFeedback.overallDiagnosis)"></p>
          </div>
        </section>

        <div class="stack-lg">
          <template x-for="(td, tdIdx) in activeQuestionSet.metadata.diagnosticFeedback.topicDiagnostics || []" :key="tdIdx">
            <article class="band stack-md">
              <div class="split split--center">
                <div class="cluster">
                  <span class="code" x-text="`Fokus ${tdIdx + 1}`"></span>
                  <span class="tag" style="background: var(--color-surface-2); border-color: var(--color-rule-2)" x-html="renderMath(td.topicLabel)"></span>
                  <template x-if="(td.sourceRefs || []).length">
                    <span class="meta" x-text="`Sumber: ${(td.sourceRefs || []).join(', ')}`"></span>
                  </template>
                </div>
                <button type="button" @click="jumpToTopicInStudyPack(td.topicLabel)" class="btn btn--ghost btn--sm">
                  Buka di Rangkuman BMP
                </button>
              </div>

              <!-- Bedah Titik Kecohan (Contrastive explanation) -->
              <div class="stack-2xs">
                <span class="label" style="color: var(--color-bad)">Bedah Titik Kecohan</span>
                <p class="prose math-prose" style="font-size: var(--text-md)" x-html="renderMath(td.whyYouWereTripped || td.misconceptionAnalysis)"></p>
              </div>

              <!-- Kaidah Inti BMP -->
              <template x-if="td.bmpKeyRule || td.reviewGuidance">
                <div class="topic-objectives" style="border-left-color: var(--color-ok)">
                  <span class="label" style="color: var(--color-ok)">Kaidah Kunci BMP</span>
                  <p class="prose math-prose" style="font-size: var(--text-sm)" x-html="renderMath(td.bmpKeyRule || td.reviewGuidance)"></p>
                </div>
              </template>

              <!-- Analogi Praktis AI -->
              <template x-if="td.practicalAnalogy">
                <div class="ai-note">
                  <div class="cluster cluster--tight">
                    <strong class="label" style="text-transform: none">Analogi &amp; Cara Ingat Praktis</strong>
                    <span class="tag" style="font-size: var(--text-xs)">Bantuan Logika AI</span>
                  </div>
                  <p class="prose math-prose" style="font-size: var(--text-sm)" x-html="renderMath(td.practicalAnalogy)"></p>
                </div>
              </template>
            </article>
          </template>
        </div>

        <div class="band" style="text-align: center; background: var(--color-paper-2); border-color: var(--color-accent); padding: var(--space-xl)">
          <div class="stack-sm" style="align-items: center">
            <h2 class="sub-title" style="font-size: var(--text-2xl)">Sudah memahami materi di atas?</h2>
            <p class="lede" style="max-width: 48ch">
              Buktikan pemahaman Anda sekarang dengan mengerjakan kuis remedial (<span class="figure" x-text="activeQuestionSet?.questions?.length || 0"></span> soal baru).
            </p>
            <button type="button" @click="remedialRunnerStep = 'quiz'" class="btn btn--primary btn--lg">
              Mulai Kuis Remedial Sekarang &rarr;
            </button>
          </div>
        </div>
      </div>
    </template>

    <!-- TAHAP 2: PENGERJAAN KUIS / QUIZ RUNNER -->
    <template x-if="activeQuestionSet?.setType !== 'remedial' || remedialRunnerStep === 'quiz' || !activeQuestionSet?.metadata?.diagnosticFeedback">
      <div class="stack-xl">
        <header class="stack-sm">
          <div class="split split--center">
            <template x-if="activeQuestionSet?.setType">
              <span class="tag" style="align-self: flex-start" x-text="setTypeLabel(activeQuestionSet.setType)"></span>
            </template>
            <template x-if="activeQuestionSet?.setType === 'remedial' && activeQuestionSet?.metadata?.diagnosticFeedback">
              <button type="button" @click="remedialRunnerStep = 'study'" class="btn btn--ghost btn--sm">
                &larr; Lihat Kembali Materi Pendalaman
              </button>
            </template>
          </div>
          <h1 class="page-title" style="font-size: var(--text-3xl)" data-view-title tabindex="-1" x-text="activeQuestionSet?.title"></h1>
          <div class="split split--center">
            <p class="lede">
              <span class="figure" x-text="activeQuestionSet?.questions?.length || 0"></span> soal pilihan ganda.
              <template x-if="quizTotalPages > 1">
                <span>
                  Menampilkan soal <strong class="figure" x-text="quizPageStartIndex + 1"></strong>&ndash;<strong class="figure" x-text="quizPageEndIndex"></strong> (Tahap <span class="figure" x-text="quizCurrentPage + 1"></span>/<span class="figure" x-text="quizTotalPages"></span>).
                </span>
              </template>
              <template x-if="quizTotalPages <= 1">
                <span>Jawab semua, lalu kumpulkan untuk melihat pembahasan.</span>
              </template>
            </p>
            <template x-if="quizTotalPages > 1">
              <span class="tag" style="background: var(--color-surface-2); border-color: var(--color-rule-2)" x-text="`Tahap ${quizCurrentPage + 1} dari ${quizTotalPages}`"></span>
            </template>
          </div>
        </header>

        <template x-for="(q, qIdx) in currentQuizPageQuestions" :key="q.id">
          <article class="question" :id="`question-card-${q.id}`">
            <div class="cluster">
              <span class="code" x-text="`Soal ${quizPageStartIndex + qIdx + 1}`"></span>
              <span class="meta" x-text="q.topicLabel"></span>
              <template x-if="q.difficulty">
                <span class="tag" x-text="difficultyLabel(q.difficulty)"></span>
              </template>
              <template x-if="q.questionType && q.questionType !== 'single_choice'">
                <span class="tag" x-text="q.questionType.replace('_', ' ')"></span>
              </template>
            </div>
            <p class="question-prompt math-prose" :id="`q-prompt-${q.id}`" x-html="renderMath(q.prompt)"></p>
            <fieldset class="options" :aria-labelledby="`q-prompt-${q.id}`">
              <template x-for="opt in q.options || []" :key="opt.key">
                <label class="option" :class="quizSelections[q.id] === opt.key ? 'is-selected' : ''">
                  <input
                    type="radio"
                    :name="`q-${q.id}`"
                    :value="opt.key"
                    x-model="quizSelections[q.id]"
                    @change="saveDraftProgress()"
                  />
                  <span class="option-key" x-text="opt.key" aria-hidden="true"></span>
                  <span x-html="renderMath(opt.text)"></span>
                </label>
              </template>
            </fieldset>
          </article>
        </template>
      </div>
    </template>
  </div>

  <!-- QUIZ FOOTER (Hanya tampil saat tahap pengerjaan soal) -->
  <div class="quiz-footer" x-show="activeQuestionSet?.setType !== 'remedial' || remedialRunnerStep === 'quiz' || !activeQuestionSet?.metadata?.diagnosticFeedback">
    <div class="quiz-footer-inner">
      <div class="grow stack-xs">
        <div class="meter meter--thin" role="progressbar" :aria-valuenow="answeredCount" aria-valuemin="0" :aria-valuemax="activeQuestionSet?.questions?.length || 0" aria-label="Soal terjawab">
          <div class="meter-seg meter-seg--progress" :style="`width: ${answeredPct}%`"></div>
        </div>
        <p class="meta">
          <strong class="figure" x-text="answeredCount"></strong> dari
          <span class="figure" x-text="activeQuestionSet?.questions?.length || 0"></span> terjawab
          <template x-if="quizTotalPages > 1">
            <span>
              &middot; Tahap ini: <strong class="figure" x-text="currentQuizPageAnsweredCount"></strong>/<span class="figure" x-text="currentQuizPageQuestions.length"></span>
            </span>
          </template>
        </p>
      </div>
      <div class="cluster cluster--tight">
        <template x-if="quizTotalPages > 1 && quizCurrentPage > 0">
          <button
            type="button"
            @click="prevQuizPage()"
            class="btn btn--ghost btn--lg"
          >
            &larr; Sebelumnya
          </button>
        </template>
        <template x-if="quizCurrentPage < quizTotalPages - 1">
          <button
            type="button"
            @click="nextQuizPage()"
            class="btn btn--primary btn--lg"
            x-text="isCurrentQuizPageComplete ? `Lanjut ke Soal ${quizPageEndIndex + 1}–${Math.min(quizPageEndIndex + quizPageSize, activeQuestionSet?.questions?.length || 0)} →` : `Jawab ${currentQuizPageQuestions.length - currentQuizPageAnsweredCount} soal lagi di tahap ini`"
          ></button>
        </template>
        <template x-if="quizCurrentPage >= quizTotalPages - 1">
          <button
            type="button"
            @click="submitQuizAnswers()"
            :disabled="submittingQuiz"
            class="btn btn--primary btn--lg"
            x-text="submittingQuiz ? 'Menilai…' : 'Kumpulkan jawaban'"
          ></button>
        </template>
      </div>
    </div>
  </div>
</section>
