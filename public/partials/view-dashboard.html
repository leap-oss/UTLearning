<section x-show="currentView === 'dashboard'" class="view" data-view="dashboard">
  <header class="split">
    <div class="stack-xs">
      <h1 class="page-title" data-view-title tabindex="-1">Perpustakaan kuliah</h1>
      <p class="lede">
        Mata kuliah yang sedang Anda pelajari. Buka salah satu untuk melihat modul, rangkuman, dan kesiapan ujian.
      </p>
    </div>
    <div class="cluster">
      <div>
        <label for="semester-filter" class="visually-hidden">Filter semester</label>
        <select id="semester-filter" x-model="selectedSemester" class="select">
          <option value="ALL">Semua semester</option>
          <template x-for="sem in semesterOptions" :key="sem">
            <option :value="sem" x-text="sem"></option>
          </template>
        </select>
      </div>
      <label class="check">
        <input type="checkbox" x-model="includeArchivedCourses" @change="loadCourses()" />
        <span>Tampilkan arsip</span>
      </label>
      <button type="button" @click="openCreateCourseModal()" class="btn">Tambah mata kuliah</button>
    </div>
  </header>

  <template x-if="dailyFocus && !loadingCourses && !coursesError">
    <section class="focus-panel" aria-labelledby="daily-focus-heading">
      <div class="focus-head">
        <div class="stack-2xs">
          <span class="label">Ritme Belajar &amp; Target Harian</span>
          <h2 id="daily-focus-heading" class="section-title">Fokus Hari Ini</h2>
        </div>

        <div class="focus-metrics">
          <div class="focus-metric">
            <span class="label">Kesiapan Semester</span>
            <span class="focus-metric__val">
              <span x-text="`${dailyFocus.summary?.readinessPercent ?? 0}%`"></span>
              <span class="meta" style="font-family: var(--font-body); font-size: var(--text-xs)">
                (<span class="figure" x-text="dailyFocus.summary?.masteredModules ?? 0"></span>/<span class="figure" x-text="dailyFocus.summary?.totalModules ?? 0"></span> modul dikuasai)
              </span>
            </span>
          </div>

          <div class="focus-metric">
            <span class="label">Streak Aktif</span>
            <span class="focus-metric__val">
              <span class="figure" x-text="`${dailyFocus.streak?.currentStreakDays ?? 0} hari`"></span>
              <span class="meta" style="font-family: var(--font-body); font-size: var(--text-xs)" x-text="dailyFocus.streak?.studiedToday ? `· ${dailyFocus.streak.todayDoneCount} kuis hari ini` : '· belum kuis hari ini'"></span>
            </span>
          </div>

          <div class="streak-days" aria-label="Aktivitas belajar 7 hari terakhir">
            <template x-for="day in dailyFocus.streak?.activeDaysLast7 || []" :key="day.dateKey">
              <div
                class="streak-day"
                :class="{ 'is-active': day.count > 0, 'is-today': day.isToday }"
                :aria-label="`${day.dayLabel}: ${day.count} sesi kuis`"
                :title="`${day.dayLabel} (${day.dateKey}): ${day.count} kuis`"
              >
                <span class="streak-day__dot" aria-hidden="true"></span>
                <span class="streak-day__label" x-text="day.dayLabel"></span>
              </div>
            </template>
          </div>
        </div>
      </div>

      <div class="uas-countdown">
        <label for="uas-target-date" class="label" style="margin: 0">Target Tanggal UAS</label>
        <input
          id="uas-target-date"
          type="date"
          :value="uasExamDate"
          @change="setUasExamDate($event.target.value)"
        />
        <template x-if="uasCountdownSummary">
          <p class="meta">
            <strong :class="uasCountdownSummary.urgent ? 'state state--review' : ''" x-text="uasCountdownSummary.daysLeftLabel"></strong>
            &middot;
            <span x-text="uasCountdownSummary.paceLabel"></span>
          </p>
        </template>
        <template x-if="!uasCountdownSummary">
          <p class="meta">Atur perkiraan tanggal UAS untuk melihat kecepatan target modul per hari.</p>
        </template>
      </div>

      <template x-if="dailyFocus.slots && dailyFocus.slots.length > 0">
        <div class="focus-grid">
          <template x-for="slot in dailyFocus.slots" :key="`${slot.slotType}-${slot.moduleId}`">
            <article
              class="mission-card"
              :class="{
                'mission-card--quick': slot.slotType === 'quick_win',
                'mission-card--conquest': slot.slotType === 'conquest',
                'mission-card--increment': slot.slotType === 'increment',
              }"
            >
              <div class="stack-xs">
                <div class="split split--center">
                  <span class="tag" x-text="slot.badgeLabel"></span>
                  <span class="meta figure" x-text="slot.durationHint"></span>
                </div>
                <h3 class="sub-title" x-text="slot.headline"></h3>
                <p class="meta" style="color: var(--color-ink-2)" x-text="slot.reason"></p>
              </div>
              <div class="cluster cluster--tight">
                <button
                  type="button"
                  class="btn btn--sm"
                  :class="slot.slotType === 'increment' ? '' : 'btn--primary'"
                  @click="executeFocusAction(slot)"
                  x-text="slot.ctaLabel"
                ></button>
                <template x-if="slot.secondaryActionType && slot.secondaryCtaLabel">
                  <button
                    type="button"
                    class="btn btn--sm btn--ghost"
                    @click="executeFocusAction(slot, slot.secondaryActionType)"
                    x-text="slot.secondaryCtaLabel"
                  ></button>
                </template>
              </div>
            </article>
          </template>
        </div>
      </template>

      <template x-if="dailyFocus.staleMasteredModules && dailyFocus.staleMasteredModules.length > 0">
        <div class="stale-strip">
          <p class="meta">
            <span class="state state--review">Perlu pemanasan (&ge; 14 hari)</span>
            <span x-text="`${dailyFocus.summary.staleMasteredCount} modul Dikuasai belum diulang lebih dari 2 minggu.`"></span>
          </p>
          <div class="cluster cluster--tight">
            <template x-for="stale in dailyFocus.staleMasteredModules.slice(0, 3)" :key="stale.moduleId">
              <button
                type="button"
                class="btn btn--sm"
                :disabled="!stale.hasQuestions"
                @click="startWarmupQuiz(stale.moduleId)"
                x-text="`${stale.courseCode} M${stale.moduleNumber} (${stale.daysSinceLastAttempt}h)`"
              ></button>
            </template>
          </div>
        </div>
      </template>
    </section>
  </template>

  <template x-if="loadingCourses && courses.length === 0">
    <div class="cluster" role="status">
      <span class="spinner keep-motion" aria-hidden="true"></span>
      <span class="meta">Memuat daftar mata kuliah…</span>
    </div>
  </template>

  <template x-if="!loadingCourses && coursesError">
    <div class="callout callout--bad" role="alert">
      <div class="stack-xs">
        <p><strong>Gagal memuat daftar mata kuliah.</strong> <span x-text="coursesError"></span></p>
        <div>
          <button type="button" @click="loadCourses()" class="btn btn--sm">Coba lagi</button>
        </div>
      </div>
    </div>
  </template>

  <template x-if="!loadingCourses && !coursesError && filteredCourses.length === 0">
    <div class="empty">
      <p class="sub-title">Belum ada mata kuliah di sini</p>
      <p class="lede">
        Tambahkan mata kuliah dengan kode dan namanya, misalnya <span class="code">MKWN4101</span> Pendidikan Agama Islam. Setelah itu Anda bisa menambahkan modul dan mengunggah halaman BMP.
      </p>
      <button type="button" @click="openCreateCourseModal()" class="btn btn--primary">Tambah mata kuliah</button>
    </div>
  </template>

  <div x-show="filteredCourses.length > 0" class="course-grid">

    <template x-for="course in filteredCourses" :key="course.id">
      <article class="course-card row-anchor">
        <!-- header card: kode + badge semester + badge arsip + menu kelola -->
        <div class="course-card__head">
          <div class="cluster cluster--tight" style="min-width:0;flex:1">
            <span class="code" x-text="course.code"></span>
            <template x-if="course.semesterLabel">
              <span class="tag tag--semester" x-text="formatSemester(course.semesterLabel)"></span>
            </template>
            <template x-if="course.status === 'archived'">
              <span class="tag">Diarsipkan</span>
            </template>
          </div>
          <!-- menu kelola (pindah dari row-actions ke sini, z-index sudah ada di .row-actions) -->
          <div class="row-actions">
            <div class="menu" x-data="{ open: false }" @click.outside="open = false" @keydown.escape="open = false">
              <button type="button" class="btn btn--ghost btn--sm" @click="open = !open" :aria-expanded="open.toString()" aria-haspopup="menu" :aria-label="`Kelola ${course.name}`">Kelola</button>
              <div class="menu-panel" x-show="open" x-transition.opacity.duration.120ms role="menu" @click="open = false">
                <button type="button" role="menuitem" class="menu-item" @click="openEditCourseModal(course)">Edit mata kuliah</button>
                <template x-if="course.status !== 'archived'">
                  <button type="button" role="menuitem" class="menu-item menu-item--danger" @click="confirmArchiveCourse(course)">Arsipkan</button>
                </template>
                <template x-if="course.status === 'archived'">
                  <button type="button" role="menuitem" class="menu-item" @click="restoreCourse(course)">Pulihkan</button>
                </template>
              </div>
            </div>
          </div>
        </div>

        <!-- nama kursus sebagai tombol (row-title + ::after overlay) -->
        <h2 class="course-card__name">
          <button type="button" class="row-title" @click="openCourse(course.id)" x-text="course.name"></button>
        </h2>

        <!-- progress meter -->
        <div class="course-card__meter">
          <div class="meter" role="img" :aria-label="`${statusSegments(course.moduleCounts, course.expectedModuleCount).mastered} dikuasai, ${statusSegments(course.moduleCounts, course.expectedModuleCount).inProgress} sedang dipelajari, ${statusSegments(course.moduleCounts, course.expectedModuleCount).needsReview} perlu review dari ${statusSegments(course.moduleCounts, course.expectedModuleCount).expected} modul`">
            <div class="meter-seg meter-seg--mastered" :style="`width: ${statusSegments(course.moduleCounts, course.expectedModuleCount).masteredPct}%`"></div>
            <div class="meter-seg meter-seg--progress" :style="`width: ${statusSegments(course.moduleCounts, course.expectedModuleCount).inProgressPct}%`"></div>
            <div class="meter-seg meter-seg--review" :style="`width: ${statusSegments(course.moduleCounts, course.expectedModuleCount).needsReviewPct}%`"></div>
          </div>
          <p class="meta">
            <strong class="figure" x-text="course.moduleCounts?.total ?? 0"></strong>
            dari <span class="figure" x-text="course.expectedModuleCount || 9"></span> modul
            <template x-if="(course.moduleCounts?.mastered || 0) > 0"><span>, <span class="figure" x-text="course.moduleCounts.mastered"></span> dikuasai</span></template>
            <template x-if="(course.moduleCounts?.needs_review || 0) > 0"><span>, <span class="figure" x-text="course.moduleCounts.needs_review"></span> perlu review</span></template>
          </p>
        </div>

        <!-- footer: last activity -->
        <p class="course-card__foot meta">Aktif <span x-text="formatDateTime(course.lastActivityAt)"></span></p>
      </article>
    </template>
  </div>
</section>
